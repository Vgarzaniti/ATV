[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atv-dj-engine"
version = "0.1.0"
description = "Deterministic Autonomous DJ Decision Engine (Vector + Structural Graph)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dsp = ["librosa>=0.10.0"]
dev = ["pytest>=7.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
